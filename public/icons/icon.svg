<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Absolute Black Canvas -->
  <rect width="512" height="512" fill="#000000"/>

  <!-- Outer Sharp Hexagon -->
  <polygon
    points="256,36 446,146 446,366 256,476 66,366 66,146"
    fill="#181818"
    stroke="#FFC000"
    stroke-width="10"
  />

  <!-- Inner Architectural Hexagon -->
  <polygon
    points="256,88 400,172 400,340 256,424 112,340 112,172"
    fill="none"
    stroke="#494949"
    stroke-width="4"
  />

  <!-- Angular 4-Point Geometric Compass Star in Lamborghini Gold -->
  <polygon
    points="256,118 282,230 394,256 282,282 256,394 230,282 118,256 230,230"
    fill="#FFC000"
  />
  <polygon
    points="256,192 272,240 320,256 272,272 256,320 240,272 192,256 240,240"
    fill="#000000"
  />
  <polygon
    points="256,232 276,256 256,280 236,256"
    fill="#FFFFFF"
  />
</svg>
